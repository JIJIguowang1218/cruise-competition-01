<line x1="480" y1="716" x2="534" y2="640" stroke="#3B7DD8" stroke-width="2"/>
<path d="M534 632 L530 646 L544 640 Z" fill="#3B7DD8"/>
<line x1="1060" y1="420" x2="1114" y2="340" stroke="#237A4C" stroke-width="2"/>
<path d="M1114 332 L1110 346 L1124 340 Z" fill="#237A4C"/>
<line x1="1060" y1="460" x2="1114" y2="434" stroke="#237A4C" stroke-width="2"/>
<path d="M1114 426 L1110 440 L1124 434 Z" fill="#237A4C"/>
<line x1="1060" y1="520" x2="1114" y2="528" stroke="#237A4C" stroke-width="2"/>
<path d="M1114 520 L1110 534 L1124 528 Z" fill="#237A4C"/>
<line x1="1060" y1="580" x2="1114" y2="622" stroke="#237A4C" stroke-width="2"/>
<path d="M1114 614 L1110 628 L1124 622 Z" fill="#237A4C"/>
<line x1="1060" y1="640" x2="1114" y2="716" stroke="#237A4C" stroke-width="2"/>
<path d="M1114 708 L1110 722 L1124 716 Z" fill="#237A4C"/>
<text x="490" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3B7DD8">读入</text>
<text x="1080" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#237A4C">输出</text>
<text x="800" y="850" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">边界：只做船司权责内的决策增强，不指挥外部机构，不替代客服 / 法务 / 港口系统</text>
<text x="800" y="880" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4A5468">内部模块与 Agent 分工不在此图展开，留给系统架构与多 Agent 页面</text>
</svg>
