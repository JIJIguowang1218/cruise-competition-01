<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>ClarSyn 在船司运营生态中的位置（详细版）</title>
<text x="60" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#1A2233">ClarSyn 在船司运营生态中的位置</text>
<text x="60" y="104" font-family="JetBrains Mono, monospace" font-size="14" fill="#3B7DD8" letter-spacing="1">SYSTEM CONTEXT · C4 LEVEL 1 · BUSINESS VIEW</text>
<line x1="60" y1="122" x2="1540" y2="122" stroke="#D8DCE3" stroke-width="2"/>
<rect x="60" y="145" width="1480" height="70" rx="12" fill="#F4F5F7" stroke="#8B95A5" stroke-dasharray="6 4"/>
<text x="800" y="176" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#4A5468">外部不可控层：港口 / 海关 / 边检 / 港调 / 交管 / OTA</text>
<text x="800" y="198" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4A5468">只做信息交换，不接收 ClarSyn 指挥</text>
<rect x="60" y="240" width="1480" height="720" rx="16" fill="#FFFFFF" stroke="#D8DCE3"/>
<text x="80" y="285" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#3B7DD8">输入来源（上游数据源）</text>
<rect x="80" y="300" width="400" height="80" rx="12" fill="#EEF0F4" stroke="#D8DCE3"/>
<text x="280" y="332" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">船期与泊位数据</text>
<text x="280" y="358" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">船期计划 / 泊位状态 / 到离港</text>
<rect x="80" y="394" width="400" height="80" rx="12" fill="#EEF0F4" stroke="#D8DCE3"/>
<text x="280" y="426" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">气象与外部环境</text>
<text x="280" y="452" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">台风路径 / 天气预警 / 港口公告</text>
<rect x="80" y="488" width="400" height="80" rx="12" fill="#EEF0F4" stroke="#D8DCE3"/>
<text x="280" y="520" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">乘客与业务数据</text>
<text x="280" y="546" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">乘客清单 / 舱房 / 预订·POS / 岸上游</text>
<rect x="80" y="582" width="400" height="80" rx="12" fill="#EEF0F4" stroke="#D8DCE3"/>
<text x="280" y="614" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">运营与客服信号</text>
<text x="280" y="640" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">客服工单 / 咨询投诉 / 现场感知 / 排队状态</text>
<rect x="80" y="676" width="400" height="80" rx="12" fill="#EEF0F4" stroke="#D8DCE3"/>
<text x="280" y="708" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">知识与规则库</text>
<text x="280" y="734" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">条款 / 合同 / 法规 / 判例 / 事故记忆</text>
<rect x="540" y="380" width="520" height="280" rx="20" fill="#FFFFFF" stroke="#3B7DD8" stroke-width="2"/>
<text x="800" y="430" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#3B7DD8">ClarSyn 决策层</text>
<text x="800" y="462" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#4A5468">事件识别 · 风险预测 · 影响推演 · 方案组合</text>
<text x="800" y="488" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#4A5468">推理理由 · 审批路由 · 审计留痕</text>
<text x="800" y="526" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#3B7DD8">READ + DECIDE + OUTPUT</text>
<text x="800" y="560" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#4A5468">不替代客服 / 法务 / 港口系统</text>
<text x="800" y="586" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#4A5468">船司权责内的决策增强层</text>
<text x="1520" y="285" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#237A4C">输出对象（下游系统）</text>
<rect x="1120" y="300" width="400" height="80" rx="12" fill="#FFFFFF" stroke="#D8DCE3"/>
<text x="1320" y="332" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">决策与指挥端</text>
<text x="1320" y="358" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">船长端 / 运营调度台 / 船员执行端</text>
<rect x="1120" y="394" width="400" height="80" rx="12" fill="#FFFFFF" stroke="#D8DCE3"/>
<text x="1320" y="426" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">客服协同系统</text>
<text x="1320" y="452" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">统一口径 / 条款依据 / 问答辅助</text>
<rect x="1120" y="488" width="400" height="80" rx="12" fill="#FFFFFF" stroke="#D8DCE3"/>
<text x="1320" y="520" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">法务与赔偿系统</text>
<text x="1320" y="546" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">事件事实 / 审计材料 / 签署记录</text>
<rect x="1120" y="582" width="400" height="80" rx="12" fill="#FFFFFF" stroke="#D8DCE3"/>
<text x="1320" y="614" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">乘客触达系统</text>
<text x="1320" y="640" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">乘客 App / 船载屏 / 广播 / 短信</text>
<rect x="1120" y="676" width="400" height="80" rx="12" fill="#FFFFFF" stroke="#D8DCE3"/>
<text x="1320" y="708" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1A2233">审计与回溯系统</text>
<text x="1320" y="734" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#4A5468">审计包 / append-only 日志 / 导出 PDF</text>
<line x1="480" y1="340" x2="534" y2="420" stroke="#3B7DD8" stroke-width="2"/>
<path d="M534 412 L530 426 L544 420 Z" fill="#3B7DD8"/>
<line x1="480" y1="434" x2="534" y2="460" stroke="#3B7DD8" stroke-width="2"/>
