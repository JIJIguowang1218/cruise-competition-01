<path d="M534 632 L530 646 L544 640 Z" fill="#C96442"/>
<line x1="1060" y1="420" x2="1114" y2="340" stroke="#2F9E63" stroke-width="2"/>
<path d="M1114 332 L1110 346 L1124 340 Z" fill="#2F9E63"/>
<line x1="1060" y1="460" x2="1114" y2="434" stroke="#2F9E63" stroke-width="2"/>
<path d="M1114 426 L1110 440 L1124 434 Z" fill="#2F9E63"/>
