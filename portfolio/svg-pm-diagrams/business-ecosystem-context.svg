<path d="M1114 520 L1110 534 L1124 528 Z" fill="#2F9E63"/>
<line x1="1060" y1="580" x2="1114" y2="622" stroke="#2F9E63" stroke-width="2"/>
<path d="M1114 614 L1110 628 L1124 622 Z" fill="#2F9E63"/>
<line x1="1060" y1="640" x2="1114" y2="716" stroke="#2F9E63" stroke-width="2"/>
<path d="M1114 708 L1110 722 L1124 716 Z" fill="#2F9E63"/>
<text x="490" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#C96442">读入</text>
<text x="1080" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#2F9E63">输出</text>
<text x="800" y="850" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1F1E1D">边界：只做船司权责内的决策增强，不指挥外部机构，不替代客服 / 法务 / 港口系统</text>
<text x="800" y="880" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6F6A63">内部模块与 Agent 分工不在此图展开，留给系统架构与多 Agent 页面</text>
</svg>
