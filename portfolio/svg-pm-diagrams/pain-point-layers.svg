<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760">
<title>ClarSyn 痛点分层图</title>
<text x="60" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#1F1E1D">痛点不是三种，而是三层</text>
<text x="60" y="104" font-family="JetBrains Mono, monospace" font-size="14" fill="#C96442" letter-spacing="1">PAIN LAYERS · EXPERIENCE · OPERATION · JUDGMENT</text>
<line x1="60" y1="122" x2="1020" y2="122" stroke="#E4E0D8" stroke-width="2"/>
<rect x="80" y="170" width="920" height="200" rx="16" fill="#FAF9F7" stroke="#E4E0D8"/>
<text x="120" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#1F1E1D">外层 · 体验层</text>
<text x="120" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6F6A63">乘客直接感受到：排队、等待、信息不确定</text>
<text x="120" y="278" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">离船等待 6–7 小时 · 福冈排队 3–4 小时 · 港口接驳信息静态</text>
<text x="120" y="306" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">叫号与分配脱节 · 预约下船时间与实际催促不一致</text>
<rect x="180" y="310" width="720" height="190" rx="16" fill="#F0EEE8" stroke="#E4E0D8"/>
<text x="220" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#1F1E1D">中层 · 运营层</text>
<text x="220" y="390" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6F6A63">组织协调与人力成本：跨系统核对、逐批沟通、口径一致</text>
<text x="220" y="420" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">跨系统核对约需 20–45 分钟 · 8 客服连续 5 小时以上</text>
<text x="220" y="448" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">航变通知链路衰减 · 多方口径不一致</text>
<rect x="280" y="440" width="520" height="180" rx="16" fill="#FFFFFF" stroke="#C96442" stroke-width="2"/>
<text x="320" y="490" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#C96442">内层 · 判断层</text>
<text x="320" y="520" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6F6A63">现有流程中最难提前看见、最难解释、最依赖综合判断的部分</text>
<text x="320" y="550" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">弱信号发现 · 长链路推演 · 库外异常</text>
<text x="320" y="578" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">可解释决策建议 · 为什么选这个方案</text>
<text x="540" y="700" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6F6A63">传统产品能解决外层和中层的一部分问题，内层是现有流程中最需要新的判断支持的部分</text>
</svg>
