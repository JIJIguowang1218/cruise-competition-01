<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760">
<title>ClarSyn 痛点分层图</title>
<text x="60" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#1F1E1D">痛点不是并列的三类，而是嵌套的三层</text>
<text x="60" y="104" font-family="JetBrains Mono, monospace" font-size="14" fill="#C96442" letter-spacing="1">PAIN LAYERS · EXPERIENCE · COLLABORATION · DECISION GOVERNANCE</text>
<line x1="60" y1="122" x2="1020" y2="122" stroke="#E4E0D8" stroke-width="2"/>
<rect x="80" y="170" width="920" height="200" rx="16" fill="#FAF9F7" stroke="#E4E0D8"/>
<text x="120" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#1F1E1D">外层 · 体验层</text>
<text x="120" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6F6A63">乘客直接感受到：排队、等待、信息不确定</text>
<text x="120" y="278" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">离船等待 6–7 小时 · 福冈排队 3–4 小时 · 港口接驳信息静态</text>
<text x="120" y="306" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">叫号与分配脱节 · 预约下船时间与实际催促不一致</text>
<rect x="180" y="310" width="720" height="190" rx="16" fill="#F0EEE8" stroke="#E4E0D8"/>
<text x="220" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#1F1E1D">中层 · 流程协同层</text>
<text x="220" y="390" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6F6A63">跨系统核对、逐批沟通、渠道同步、口径一致</text>
<text x="220" y="420" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">跨系统核对耗时长 · 逐批沟通工作量大 · 各渠道信息不同步</text>
<text x="220" y="448" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">航变通知链路衰减 · 多方口径不一致</text>
<rect x="280" y="440" width="520" height="180" rx="16" fill="#FFFFFF" stroke="#C96442" stroke-width="2"/>
<text x="320" y="490" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#C96442">内层 · 决策治理层</text>
<text x="320" y="520" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6F6A63">藏在运营最深处：判断、解释、透明留痕</text>
<text x="320" y="550" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">风险迹象积累 · 新情况识别 · 连锁影响推演</text>
<text x="320" y="578" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1F1E1D">决策理由解释 · 透明留痕 · 责任可溯</text>
<text x="540" y="700" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6F6A63">三层是嵌套关系：体验是表象，流程协同是机制，决策治理是运营深处的核心困难</text>
</svg>
