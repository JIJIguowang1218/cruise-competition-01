<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<title>ClarSyn 总体研究流程</title>
<text x="60" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#1F1E1D">ClarSyn 总体研究流程</text>
<text x="60" y="104" font-family="JetBrains Mono, monospace" font-size="14" fill="#C96442" letter-spacing="1">DESK RESEARCH · EVIDENCE TRIANGULATION · AI MAPPING · PRODUCT CONVERGENCE</text>
<line x1="60" y1="122" x2="1220" y2="122" stroke="#E4E0D8" stroke-width="2"/>
<rect x="60" y="180" width="208" height="230" rx="12" fill="#FFFFFF" stroke="#E4E0D8"/>
