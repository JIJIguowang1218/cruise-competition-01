<text x="164" y="352" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1F1E1D">重点场景判断</text>
<rect x="296" y="180" width="208" height="230" rx="12" fill="#FFFFFF" stroke="#E4E0D8"/>
<rect x="296" y="180" width="208" height="6" rx="3" fill="#C96442"/>
<text x="400" y="216" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#1F1E1D">痛点证据收集</text>
<text x="400" y="248" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6F6A63">公开资料 · 用户 UGC</text>
<text x="400" y="270" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6F6A63">媒体调查 · 政府答复</text>
<text x="400" y="298" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6F6A63">多源交叉验证</text>
