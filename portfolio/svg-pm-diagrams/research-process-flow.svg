<text x="400" y="352" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1F1E1D">痛点清单 + 证据等级</text>
<rect x="532" y="180" width="208" height="230" rx="12" fill="#FFFFFF" stroke="#E4E0D8"/>
<rect x="532" y="180" width="208" height="6" rx="3" fill="#D97757"/>
<text x="636" y="216" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#1F1E1D">AI 能力匹配</text>
<text x="636" y="248" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6F6A63">Hackathon 高分案例</text>
<text x="636" y="270" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6F6A63">竞品方案 · 技术可行性</text>
<text x="636" y="298" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6F6A63">规则与 AI 边界</text>
<text x="636" y="330" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#D97757">OUT 03</text>
<text x="636" y="352" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1F1E1D">AI 优势模式 + 边界</text>
<rect x="768" y="180" width="208" height="230" rx="12" fill="#FFFFFF" stroke="#E4E0D8"/>
