<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- ============ FX · Glow Card（无滤镜版：径向渐变 + 指数衰减薄层堆叠，Figma 导入不丢效果） ============ -->
  <defs>
    <radialGradient id="bgGrad" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0" stop-color="#0E1119"/>
      <stop offset="0.52" stop-color="#0A0C11"/>
      <stop offset="1" stop-color="#060709"/>
    </radialGradient>
    <radialGradient id="hazeGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#4C8DFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171C26"/>
      <stop offset="1" stop-color="#10141B"/>
    </linearGradient>
  </defs>

  <!-- canvas : vignette dark bg -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- ambient haze : light thrown onto the backdrop -->
  <ellipse cx="800" cy="450" rx="700" ry="440" fill="url(#hazeGrad)"/>

  <!-- near-edge glow : 30 exponential-falloff layers, outer to inner -->
  <rect x="407" y="207" width="786" height="486" rx="25" fill="#4C8DFF" opacity="0.0534"/>
  <rect x="404" y="204" width="792" height="492" rx="28" fill="#4C8DFF" opacity="0.0476"/>
  <rect x="401" y="201" width="798" height="498" rx="31" fill="#4C8DFF" opacity="0.0424"/>
  <rect x="398" y="198" width="804" height="504" rx="34" fill="#4C8DFF" opacity="0.0378"/>
  <rect x="395" y="195" width="810" height="510" rx="37" fill="#4C8DFF" opacity="0.0337"/>
  <rect x="392" y="192" width="816" height="516" rx="40" fill="#4C8DFF" opacity="0.0300"/>
  <rect x="389" y="189" width="822" height="522" rx="43" fill="#4C8DFF" opacity="0.0267"/>
  <rect x="386" y="186" width="828" height="528" rx="46" fill="#4C8DFF" opacity="0.0238"/>
  <rect x="383" y="183" width="834" height="534" rx="49" fill="#4C8DFF" opacity="0.0212"/>
  <rect x="380" y="180" width="840" height="540" rx="52" fill="#4C8DFF" opacity="0.0189"/>
  <rect x="377" y="177" width="846" height="546" rx="55" fill="#4C8DFF" opacity="0.0168"/>
  <rect x="374" y="174" width="852" height="552" rx="58" fill="#4C8DFF" opacity="0.0150"/>
  <rect x="371" y="171" width="858" height="558" rx="61" fill="#4C8DFF" opacity="0.0134"/>
  <rect x="368" y="168" width="864" height="564" rx="64" fill="#4C8DFF" opacity="0.0119"/>
  <rect x="365" y="165" width="870" height="570" rx="67" fill="#4C8DFF" opacity="0.0106"/>
  <rect x="362" y="162" width="876" height="576" rx="70" fill="#4C8DFF" opacity="0.0095"/>
  <rect x="359" y="159" width="882" height="582" rx="73" fill="#4C8DFF" opacity="0.0084"/>
  <rect x="356" y="156" width="888" height="588" rx="76" fill="#4C8DFF" opacity="0.0075"/>
  <rect x="353" y="153" width="894" height="594" rx="79" fill="#4C8DFF" opacity="0.0067"/>
  <rect x="350" y="150" width="900" height="600" rx="82" fill="#4C8DFF" opacity="0.0060"/>
  <rect x="347" y="147" width="906" height="606" rx="85" fill="#4C8DFF" opacity="0.0053"/>
  <rect x="344" y="144" width="912" height="612" rx="88" fill="#4C8DFF" opacity="0.0047"/>
  <rect x="341" y="141" width="918" height="618" rx="91" fill="#4C8DFF" opacity="0.0042"/>
  <rect x="338" y="138" width="924" height="624" rx="94" fill="#4C8DFF" opacity="0.0038"/>
  <rect x="335" y="135" width="930" height="630" rx="97" fill="#4C8DFF" opacity="0.0033"/>
  <rect x="332" y="132" width="936" height="636" rx="100" fill="#4C8DFF" opacity="0.0030"/>
  <rect x="329" y="129" width="942" height="642" rx="103" fill="#4C8DFF" opacity="0.0027"/>
  <rect x="326" y="126" width="948" height="648" rx="106" fill="#4C8DFF" opacity="0.0024"/>
  <rect x="323" y="123" width="954" height="654" rx="109" fill="#4C8DFF" opacity="0.0021"/>
  <rect x="320" y="120" width="960" height="660" rx="112" fill="#4C8DFF" opacity="0.0173"/>

  <!-- card face -->
  <rect x="410" y="210" width="780" height="480" rx="22" fill="url(#cardGrad)"/>

  <!-- rim light -->
  <rect x="410.5" y="210.5" width="779" height="479" rx="21.5" fill="none" stroke="#7EA6FF" stroke-opacity="0.30" stroke-width="1"/>

  <!-- top inner highlight -->
  <line x1="434" y1="212" x2="1166" y2="212" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" stroke-linecap="round"/>
</svg>
