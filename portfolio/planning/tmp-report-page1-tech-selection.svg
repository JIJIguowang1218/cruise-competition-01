<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif">
  <!-- ============ PAGE 1 / 3 : 业务技术选型 ============ -->
  <rect id="bg" x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <!-- header -->
  <text x="1540" y="54" text-anchor="end" font-size="15" fill="#8A8F98" letter-spacing="3">01 / 03</text>
  <text x="60" y="74" font-size="36" font-weight="700" fill="#111111">业务技术选型：什么问题，用什么技术</text>
  <text x="60" y="112" font-size="18" fill="#555555">能确定的归代码，需要理解和推理的才给模型——每类业务问题匹配最合适的技术形态</text>
  <line x1="60" y1="136" x2="1540" y2="136" stroke="#111111" stroke-width="2"/>

  <!-- table shell -->
  <rect id="table-shell" x="60" y="160" width="1480" height="500" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <!-- header row -->
  <rect id="table-head" x="60" y="160" width="1480" height="52" fill="#111111"/>
  <text x="80" y="194" font-size="18" font-weight="700" fill="#FFFFFF">业务环节</text>
  <text x="380" y="194" font-size="18" font-weight="700" fill="#FFFFFF">技术形态</text>
  <text x="820" y="194" font-size="18" font-weight="700" fill="#FFFFFF">这样选的理由</text>

  <!-- row backgrounds -->
  <rect id="row-2" x="60" y="268" width="1480" height="56" fill="#F4F5F7"/>
  <rect id="row-4" x="60" y="380" width="1480" height="56" fill="#F4F5F7"/>
  <rect id="row-6" x="60" y="492" width="1480" height="56" fill="#E4E7EB"/>
  <rect id="row-6-bar" x="60" y="492" width="6" height="56" fill="#111111"/>
  <rect id="row-8" x="60" y="604" width="1480" height="56" fill="#F4F5F7"/>

  <!-- row hairlines -->
  <line x1="60" y1="268" x2="1540" y2="268" stroke="#D5D8DD"/>
  <line x1="60" y1="324" x2="1540" y2="324" stroke="#D5D8DD"/>
  <line x1="60" y1="380" x2="1540" y2="380" stroke="#D5D8DD"/>
  <line x1="60" y1="436" x2="1540" y2="436" stroke="#D5D8DD"/>
  <line x1="60" y1="492" x2="1540" y2="492" stroke="#111111" stroke-width="1.5"/>
  <line x1="60" y1="548" x2="1540" y2="548" stroke="#D5D8DD"/>
  <line x1="60" y1="604" x2="1540" y2="604" stroke="#D5D8DD"/>
  <line x1="360" y1="212" x2="360" y2="660" stroke="#D5D8DD"/>
  <line x1="800" y1="212" x2="800" y2="660" stroke="#D5D8DD"/>

  <!-- row 1 y212 -->
  <text x="80" y="247" font-size="18" fill="#111111">多系统接入与数据标准化</text>
  <text x="380" y="247" font-size="18" fill="#111111">工程适配器（纯代码）</text>
  <text x="820" y="247" font-size="18" fill="#333333">高并发读取是工程能力，不是模型生成能力</text>
  <!-- row 2 y268 -->
  <text x="80" y="303" font-size="18" fill="#111111">事件分类、严重度判定</text>
  <text x="380" y="303" font-size="18" fill="#111111">端侧小模型 0.5B–4B ＋ 规则复核</text>
  <text x="820" y="303" font-size="18" fill="#333333">类别被事件库锁死，模型只做选择题，不能自由发挥</text>
  <!-- row 3 y324 -->
  <text x="80" y="359" font-size="18" fill="#111111">库外异常发现（没见过的事件）</text>
  <text x="380" y="359" font-size="18" fill="#111111">无监督异常检测 ＋ 提醒卡</text>
  <text x="820" y="359" font-size="18" fill="#333333">规则看不见库外；只提醒、不执行，处置权永远在人</text>
  <!-- row 4 y380 -->
  <text x="80" y="415" font-size="18" fill="#111111">时间窗 / 人数 / 排队 / 资源缺口</text>
  <text x="380" y="415" font-size="18" fill="#111111">确定性算法（纯代码）</text>
  <text x="820" y="415" font-size="18" fill="#333333">数字必须可复现、可审计——AI 不做算术</text>
  <!-- row 5 y436 -->
  <text x="80" y="471" font-size="18" fill="#111111">条款、策略、历史预案调用</text>
  <text x="380" y="471" font-size="18" fill="#111111">RAG 检索 ＋ 逐字引用编号</text>
  <text x="820" y="471" font-size="18" fill="#333333">只从已有库中选择组合，禁止现场编造条款</text>
  <!-- row 6 y492 highlight -->
  <text x="84" y="527" font-size="18" font-weight="700" fill="#111111">方案组合与长链路推演</text>
  <text x="380" y="527" font-size="18" font-weight="700" fill="#111111">多 Agent 固定链（第 2 页展开）</text>
  <text x="820" y="527" font-size="18" font-weight="700" fill="#111111">分段推理、结构化交接、每步可回滚可审计</text>
  <!-- row 7 y548 -->
  <text x="80" y="583" font-size="18" fill="#111111">多语言话术与乘客解释</text>
  <text x="380" y="583" font-size="18" fill="#111111">端侧小模型 · 单次生成</text>
  <text x="820" y="583" font-size="18" fill="#333333">表达层而非决策层；条款原文不可改动</text>
  <!-- row 8 y604 -->
  <text x="80" y="639" font-size="18" fill="#111111">审批、触达、审计</text>
  <text x="380" y="639" font-size="18" fill="#111111">规则工作流 ＋ 人审批</text>
  <text x="820" y="639" font-size="18" fill="#333333">模型不持有任何写操作与发送工具</text>

  <!-- three rules -->
  <rect x="60" y="688" width="480" height="104" fill="#F4F5F7" stroke="#111111" stroke-width="1.5"/>
  <rect x="60" y="688" width="480" height="6" fill="#111111"/>
  <rect x="80" y="710" width="64" height="26" fill="#111111"/>
  <text x="112" y="729" text-anchor="middle" font-size="14" fill="#FFFFFF">规则 1</text>
  <text x="80" y="770" font-size="20" font-weight="700" fill="#111111">能规则就不用机器学习</text>

  <rect x="560" y="688" width="480" height="104" fill="#F4F5F7" stroke="#111111" stroke-width="1.5"/>
  <rect x="560" y="688" width="480" height="6" fill="#111111"/>
  <rect x="580" y="710" width="64" height="26" fill="#111111"/>
  <text x="612" y="729" text-anchor="middle" font-size="14" fill="#FFFFFF">规则 2</text>
  <text x="580" y="770" font-size="20" font-weight="700" fill="#111111">实时闭环只用船载本地模型</text>

  <rect x="1060" y="688" width="480" height="104" fill="#F4F5F7" stroke="#111111" stroke-width="1.5"/>
  <rect x="1060" y="688" width="480" height="6" fill="#111111"/>
  <rect x="1080" y="710" width="64" height="26" fill="#111111"/>
  <text x="1112" y="729" text-anchor="middle" font-size="14" fill="#FFFFFF">规则 3</text>
  <text x="1080" y="763" font-size="19" font-weight="700" fill="#111111">云端永不进 3 分钟实时闭环，</text>
  <text x="1080" y="788" font-size="19" font-weight="700" fill="#111111">只做岸基离线的长文档解析</text>

  <!-- closing quote -->
  <rect x="60" y="826" width="6" height="46" fill="#111111"/>
  <text x="84" y="856" font-size="21" font-weight="700" fill="#111111">AI 只站在规则引擎到不了的三块地上：看见没见过的、推演没写过的、解释说不清的。</text>
</svg>
