<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif">
  <!-- ============ PAGE 1 / 3 : 业务技术选型（A3 浅色风格重绘 · 文本内容与原稿一致） ============ -->
  <rect x="0" y="0" width="1600" height="900" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1180" height="8" fill="#3B7DD8"/>
  <rect x="1180" y="0" width="200" height="8" fill="#D98A1F"/>

  <!-- header -->
  <text x="60" y="76" font-size="34" font-weight="700" fill="#22304A">业务技术选型：什么问题，用什么技术</text>
  <text x="60" y="112" font-size="18" fill="#4A5468">能确定的归代码，需要理解和推理的才给模型——每类业务问题匹配最合适的技术形态</text>
  <line x1="60" y1="136" x2="1540" y2="136" stroke="#D8DCE3" stroke-width="1.5"/>

  <!-- main white card -->
  <rect x="40" y="150" width="1520" height="556" rx="14" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1.5"/>

  <!-- table header band -->
  <rect x="80" y="176" width="1440" height="50" rx="8" fill="#EAF1FC"/>
  <text x="100" y="209" font-size="16" font-weight="700" fill="#2E6DA8">业务环节</text>
  <text x="400" y="209" font-size="16" font-weight="700" fill="#2E6DA8">技术形态</text>
  <text x="830" y="209" font-size="16" font-weight="700" fill="#2E6DA8">这样选的理由</text>

  <!-- column separators / row hairlines -->
  <line x1="380" y1="190" x2="380" y2="666" stroke="#E3E7EE"/>
  <line x1="810" y1="190" x2="810" y2="666" stroke="#E3E7EE"/>
  <line x1="80" y1="281" x2="1520" y2="281" stroke="#E3E7EE"/>
  <line x1="80" y1="336" x2="1520" y2="336" stroke="#E3E7EE"/>
  <line x1="80" y1="391" x2="1520" y2="391" stroke="#E3E7EE"/>
  <line x1="80" y1="446" x2="1520" y2="446" stroke="#E3E7EE"/>
  <line x1="80" y1="501" x2="1520" y2="501" stroke="#E3E7EE"/>
  <line x1="80" y1="556" x2="1520" y2="556" stroke="#E3E7EE"/>
  <line x1="80" y1="611" x2="1520" y2="611" stroke="#E3E7EE"/>

  <!-- zebra rows -->
  <rect x="80" y="281" width="1440" height="55" fill="#F8F9FC"/>
  <rect x="80" y="391" width="1440" height="55" fill="#F8F9FC"/>
  <rect x="80" y="611" width="1440" height="55" fill="#F8F9FC"/>

  <!-- highlight row 6 : 方案组合与长链路推演 -->
  <rect x="80" y="501" width="1440" height="55" fill="#FDF3E2"/>
  <rect x="80" y="501" width="6" height="55" fill="#D98A1F"/>

  <!-- row 1 -->
  <text x="100" y="261" font-size="18" fill="#1A2233">多系统接入与数据标准化</text>
  <text x="400" y="261" font-size="18" fill="#1A2233">工程适配器（纯代码）</text>
  <text x="830" y="261" font-size="18" fill="#4A5468">高并发读取是工程能力，不是模型生成能力</text>
  <!-- row 2 -->
  <text x="100" y="316" font-size="18" fill="#1A2233">事件分类、严重度判定</text>
  <text x="400" y="316" font-size="18" fill="#1A2233">端侧小模型 0.5B–4B ＋ 规则复核</text>
  <text x="830" y="316" font-size="18" fill="#4A5468">类别被事件库锁死，模型只做选择题，不能自由发挥</text>
  <!-- row 3 -->
  <text x="100" y="371" font-size="18" fill="#1A2233">库外异常发现（没见过的事件）</text>
  <text x="400" y="371" font-size="18" fill="#1A2233">无监督异常检测 ＋ 提醒卡</text>
  <text x="830" y="371" font-size="18" fill="#4A5468">规则看不见库外；只提醒、不执行，处置权永远在人</text>
  <!-- row 4 -->
  <text x="100" y="426" font-size="18" fill="#1A2233">时间窗 / 人数 / 排队 / 资源缺口</text>
  <text x="400" y="426" font-size="18" fill="#1A2233">确定性算法（纯代码）</text>
  <text x="830" y="426" font-size="18" fill="#4A5468">数字必须可复现、可审计——AI 不做算术</text>
  <!-- row 5 -->
  <text x="100" y="481" font-size="18" fill="#1A2233">条款、策略、历史预案调用</text>
  <text x="400" y="481" font-size="18" fill="#1A2233">RAG 检索 ＋ 逐字引用编号</text>
  <text x="830" y="481" font-size="18" fill="#4A5468">只从已有库中选择组合，禁止现场编造条款</text>
  <!-- row 6 highlight -->
  <text x="104" y="536" font-size="18" font-weight="700" fill="#1A2233">方案组合与长链路推演</text>
  <text x="400" y="536" font-size="18" font-weight="700" fill="#1A2233">多 Agent 固定链（第 2 页展开）</text>
  <text x="830" y="536" font-size="18" font-weight="700" fill="#1A2233">分段推理、结构化交接、每步可回滚可审计</text>
  <!-- row 7 -->
  <text x="100" y="591" font-size="18" fill="#1A2233">多语言话术与乘客解释</text>
  <text x="400" y="591" font-size="18" fill="#1A2233">端侧小模型 · 单次生成</text>
  <text x="830" y="591" font-size="18" fill="#4A5468">表达层而非决策层；条款原文不可改动</text>
  <!-- row 8 -->
  <text x="100" y="646" font-size="18" fill="#1A2233">审批、触达、审计</text>
  <text x="400" y="646" font-size="18" fill="#1A2233">规则工作流 ＋ 人审批</text>
  <text x="830" y="646" font-size="18" fill="#4A5468">模型不持有任何写操作与发送工具</text>

  <!-- three rule cards -->
  <rect x="40" y="724" width="480" height="92" rx="10" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1.5"/>
  <rect x="41" y="725" width="478" height="6" fill="#3B7DD8"/>
  <rect x="58" y="742" width="64" height="26" rx="6" fill="#EAF1FC"/>
  <text x="90" y="760" text-anchor="middle" font-size="13" font-weight="700" fill="#2E6DA8">规则 1</text>
  <text x="58" y="800" font-size="19" font-weight="700" fill="#1D4E7E">能规则就不用机器学习</text>

  <rect x="560" y="724" width="480" height="92" rx="10" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1.5"/>
  <rect x="561" y="725" width="478" height="6" fill="#3B7DD8"/>
  <rect x="578" y="742" width="64" height="26" rx="6" fill="#EAF1FC"/>
  <text x="610" y="760" text-anchor="middle" font-size="13" font-weight="700" fill="#2E6DA8">规则 2</text>
  <text x="578" y="800" font-size="19" font-weight="700" fill="#1D4E7E">实时闭环只用船载本地模型</text>

  <rect x="1080" y="724" width="480" height="92" rx="10" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1.5"/>
  <rect x="1081" y="725" width="478" height="6" fill="#3B7DD8"/>
  <rect x="1098" y="742" width="64" height="26" rx="6" fill="#EAF1FC"/>
  <text x="1130" y="760" text-anchor="middle" font-size="13" font-weight="700" fill="#2E6DA8">规则 3</text>
  <text x="1098" y="794" font-size="18" font-weight="700" fill="#1D4E7E">云端永不进 3 分钟实时闭环，</text>
  <text x="1098" y="818" font-size="18" font-weight="700" fill="#1D4E7E">只做岸基离线的长文档解析</text>

  <!-- closing quote banner -->
  <rect x="40" y="830" width="1520" height="46" rx="8" fill="#EAF1FC"/>
  <rect x="40" y="830" width="6" height="46" fill="#3B7DD8"/>
  <text x="64" y="860" font-size="21" font-weight="700" fill="#1D4E7E">AI 只站在规则引擎到不了的三块地上：看见没见过的、推演没写过的、解释说不清的。</text>

  <!-- footer -->
  <text x="40" y="894" font-size="13" fill="#8B95A5">ClarSyn / 邮轮港岸协同与航变响应</text>
  <text x="1540" y="894" text-anchor="end" font-size="13" fill="#8B95A5" letter-spacing="3">01 / 03</text>
</svg>
